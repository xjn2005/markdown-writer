name: Check package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: markdown-editor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Dependency audit
            command: npm audit --audit-level=high
          - name: Build
            command: npm run build
          - name: Unit tests
            command: npm test
          - name: Package contents
            command: npm pack --dry-run
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  check:
    name: check
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every named check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "${CHECKS_RESULT}" != 'success' ]; then
            echo '::error title=Package checks failed::Open the named failed check above for its focused log.'
            exit 1
          fi
          echo 'All package checks passed.'
